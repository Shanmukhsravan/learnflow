<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - LearnFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .support-container { max-width: 600px; margin: 4rem auto; background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .form-control:focus, .form-select:focus { border-color: #4f46e5; box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25); }
    </style>
</head>
<body>

<div class="container">
    <div class="support-container">
        <a href="javascript:history.back()" class="text-decoration-none text-muted mb-4 d-inline-block"><i class="bi bi-arrow-left"></i> Go Back</a>
        <h2 class="fw-bold mb-1" style="color: #1e1b4b;">How can we help?</h2>
        <p class="text-muted mb-4">Submit a query and our LearnFlow admins will assist you shortly.</p>

        <form id="supportForm" onsubmit="submitQuery(event)">
            <div class="mb-3">
                <label class="form-label fw-bold">Your Role</label>
                <input type="text" class="form-control bg-light" value="{{ role.capitalize() }}" disabled>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Subject</label>
                <input type="text" id="subject" class="form-control" placeholder="Brief summary of your issue" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Message</label>
                <textarea id="message" class="form-control" rows="5" placeholder="Please describe your issue in detail..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill" style="background-color: #4f46e5; border: none;">Submit Query</button>
            <div id="queryMessage" class="mt-3 fw-bold text-center" style="display: none;"></div>
        </form>
    </div>
</div>

<script>
async function submitQuery(e) {
    e.preventDefault();
    const msg = document.getElementById('queryMessage');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerText = 'Sending...';

    try {
        const res = await fetch('/api/queries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            })
        });
        const data = await res.json();
        if (data.success) {
            msg.style.color = '#10b981';
            msg.innerText = 'Query submitted successfully! We will get back to you soon.';
            msg.style.display = 'block';
            e.target.reset();
        } else {
            msg.style.color = '#ef4444';
            msg.innerText = data.error || 'Failed to submit query.';
            msg.style.display = 'block';
        }
    } catch (err) {
        msg.style.color = '#ef4444';
        msg.innerText = 'An error occurred. Please try again.';
        msg.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Query';
    }
}
</script>

</body>
</html>
